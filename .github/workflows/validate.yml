name: Validate benchmark fixtures
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/render_docs.py
      - run: git diff --exit-code -- docs/QUESTIONS.zh-CN.md docs/REFERENCE.zh-CN.md docs/CHALLENGES.zh-CN.md docs/ENGINEERING.zh-CN.md
